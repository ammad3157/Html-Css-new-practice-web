<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080e19">
    <meta name="description" content="Explore the 99 beautiful names of Allah with meanings and Arabic pronunciation.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>99 Names of Allah</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="splash-screen" id="splashScreen" aria-labelledby="splashTitle">
        <div class="splash-content">
            <img class="splash-logo" src="icon.svg" alt="Asma ul Husna logo">
            <p class="splash-eyebrow">A beautiful remembrance</p>
            <h1 id="splashTitle" lang="ar" dir="rtl">أَسْمَاءُ اللَّهِ الْحُسْنَى</h1>
            <p class="splash-subtitle">The 99 Beautiful Names of Allah</p>
            <button class="next-button" id="splashNextButton" type="button">Next <span aria-hidden="true">→</span></button>
        </div>
    </section>

    <main class="page" id="appContent" hidden>
        <header class="hero">
            <p class="eyebrow" lang="ar" dir="rtl">أَسْمَاءُ اللَّهِ الْحُسْنَى</p>
            <h1 id="appHeading" tabindex="-1">99 Names of Allah</h1>
            <p class="arabic-intro">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
            <p class="intro">Beautiful names, qualities, and attributes of Allah</p>
            <button class="install-button" id="installAppButton" type="button" hidden>Install App</button>
        </header>

        <section class="names-grid" id="namesGrid" aria-label="Names of Allah"></section>

        <footer>
            <p>ٱللّٰه</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
